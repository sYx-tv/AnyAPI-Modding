name: Repository checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    # Linux-only checks. Native builds and tests still need Windows and the installed game.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Docs, encoding and catalog
        run: python3 .github/scripts/check_repo.py
      - name: Workflow syntax
        run: |
          curl -sSfL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz | tar xz actionlint
          ./actionlint -color
      - name: Publish script tests
        run: python3 .github/scripts/test_publish_release.py
      - name: Examples compile against the public headers
        run: |
          status=0
          for file in native/examples/*.cpp docs/development/tutorial/ModeBadge/mod.cpp; do
            clang++ -std=c++20 -fms-extensions -fsyntax-only -Wno-ignored-attributes -D_WIN32 \
              -I .github/scripts/stub -I sdk/include "$file" || { echo "::error file=$file::does not compile"; status=1; }
          done
          exit $status
