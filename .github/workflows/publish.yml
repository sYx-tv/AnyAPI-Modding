name: Publish a release
# Publishes one prepared draft release and points the catalog (or the manager
# feed) at it. Build, test and package on Windows first, then upload the files
# to a draft release. See docs/development/publishing.md.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release tag (vX.Y.Z, mods-YYYY.MM.DD[.N] or manager-vX.Y.Z)
        required: true
      dry_run:
        description: Only check the draft and show the catalog change
        type: boolean
        default: true
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      ASSETS: ${{ runner.temp }}/assets
      PLAN: ${{ runner.temp }}/plan.json
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Download the draft release
        run: |
          if ! draft=$(gh release view "$TAG" --json isDraft --jq .isDraft); then
            echo "::error::No release named $TAG. Create it as a draft with its assets first."; exit 1
          fi
          if [ "$draft" != true ]; then
            echo "::error::$TAG is already published. Published assets are immutable; use a new tag."; exit 1
          fi
          gh release download "$TAG" --dir "$ASSETS"
      - name: Check the assets and update the catalog
        run: python3 .github/scripts/publish_release.py prepare --tag "$TAG" --assets "$ASSETS" --plan "$PLAN" --summary "$GITHUB_STEP_SUMMARY"
      - name: Repository checks
        run: |
          python3 .github/scripts/check_repo.py
          git diff --stat
          git diff
      - name: Publish the release
        if: ${{ !inputs.dry_run }}
        run: |
          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx release.json; then
            gh release delete-asset "$TAG" release.json --yes
          fi
          # The manager release stays "latest" so the direct download link finds it.
          case "$TAG" in manager-v*) latest=true ;; *) latest=false ;; esac
          gh release edit "$TAG" --draft=false --latest="$latest"
      - name: Check the public downloads
        if: ${{ !inputs.dry_run }}
        run: python3 .github/scripts/publish_release.py verify --plan "$PLAN"
      - name: Commit the catalog
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json manager-update.json
          git commit -m "Publish $TAG"
          git pull --rebase origin main
          if ! git push origin HEAD:main; then
            branch="publish/$TAG"
            git push origin "HEAD:refs/heads/$branch"
            gh pr create --base main --head "$branch" --title "Publish $TAG" \
              --body "The $TAG release is public and its downloads were verified. main could not be updated directly; merge this to list it."
            echo "::warning::main is protected; opened a pull request for the catalog change."
          fi
