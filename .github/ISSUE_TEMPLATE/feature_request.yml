name: Feature or mod idea
description: Suggest a new mod, a mod feature or an API service.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What would it let you do?
  - type: textarea
    id: api
    attributes:
      label: For mod authors: which game data or behavior would a service need to expose?
